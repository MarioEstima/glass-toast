<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glass-toast</title>
  </head>
  <body>
    <script>
      window['__DEV__'] = window['__DEV__'] || true; window['global'] = window['global'] || window;
      // Apply the theme before React mounts to avoid a flash of the wrong scheme.
      document.documentElement.dataset.scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
